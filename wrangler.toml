name = "legakeys1"
main = "worker.ts"
compatibility_date = "2026-10-04"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Neon is the canonical production database.
# A Cloudflare Hyperdrive binding may be added once its real ID is available.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<NEON_HYPERDRIVE_ID>"

# Production observability: runtime exceptions and failed invocations must be diagnosable.
[observability]
enabled = true
head_sampling_rate = 1

[observability.issues]
enabled = true

[observability.traces]
enabled = true
head_sampling_rate = 0.1
