name: LegaKeys Production Readiness

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Canonical LegaKeys production Worker URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify production contract
        env:
          LEGAKEYS_PRODUCTION_URL: ${{ inputs.production_url }}
        run: node scripts/production-readiness.mjs
      - name: Verify core domain contract
        env:
          LEGAKEYS_PRODUCTION_URL: ${{ inputs.production_url }}
        run: |
          node --input-type=module - <<'NODE'
          const url = process.env.LEGAKEYS_PRODUCTION_URL.replace(/\/$/, "") + "/api/core-domains";
          const response = await fetch(url, { headers: { accept: "application/json" } });
          const body = await response.json();
          if (!response.ok || body?.ok !== true || body?.state !== "VERIFIED" || body?.domain_count !== 5) {
            console.error(JSON.stringify(body, null, 2));
            process.exit(1);
          }
          console.log(JSON.stringify(body, null, 2));
          NODE
