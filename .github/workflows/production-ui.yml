name: LegaKeys Production UI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "worker.ts"
      - "wrangler.toml"
      - ".github/workflows/production-ui.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "worker.ts"
      - "wrangler.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Apply canonical Neon schema
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "NEON_DATABASE_URL GitHub secret is required"; exit 1; }
          # Normalize accidental CR/LF introduced when copying the Neon URL from the dashboard.
          DATABASE_URL="$(printf "%s" "$DATABASE_URL" | tr -d "\r\n")"
          export DATABASE_URL
          chmod +x database/apply-canonical-schema.sh
          ./database/apply-canonical-schema.sh

      - name: Configure Worker Neon database secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LEGAKEYS }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "NEON_DATABASE_URL GitHub secret is required"; exit 1; }
          DATABASE_URL="$(printf "%s" "$DATABASE_URL" | tr -d "\r\n")"
          export DATABASE_URL
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LEGAKEYS }}
        run: npx wrangler deploy --strict
      - name: Verify deployed canonical runtime
        env:
          LEGAKEYS_PRODUCTION_URL: https://legakeys1.kyabutwabis-f.workers.dev
        run: |
          node --input-type=module - <<'NODE'
          const base = process.env.LEGAKEYS_PRODUCTION_URL.replace(/\/$/, "");
          const checks = ["/api/health", "/api/services", "/api/places", "/api/core-domains"];
          for (const path of checks) {
            const response = await fetch(base + path, { headers: { accept: "application/json" } });
            const body = await response.json().catch(() => null);
            console.log(path, response.status, JSON.stringify(body));
            if (!response.ok || body?.ok !== true) process.exit(1);
            if (path === "/api/services" && (!Array.isArray(body.data) || body.data.length < 17)) process.exit(1);
          }
          NODE
