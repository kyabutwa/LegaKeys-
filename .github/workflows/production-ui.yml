name: LegaKeys Production UI
# Canonical migration runner is intentionally rerunnable against the existing production database.
# Identity FK guard corrected for PostgreSQL reruns.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "worker.ts"
      - "wrangler.toml"
      - "implementation/**"
      - "database/**"
      - ".github/workflows/production-ui.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "worker.ts"
      - "wrangler.toml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Apply canonical Neon schema
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "NEON_DATABASE_URL GitHub secret is required"; exit 1; }
          # Normalize accidental CR/LF introduced when copying the Neon URL from the dashboard.
          DATABASE_URL="$(printf "%s" "$DATABASE_URL" | tr -d "\r\n")"
          export DATABASE_URL
          chmod +x database/apply-canonical-schema.sh
          ./database/apply-canonical-schema.sh

      - name: Configure Worker Neon database secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LEGAKEYS }}
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || { echo "NEON_DATABASE_URL GitHub secret is required"; exit 1; }
          DATABASE_URL="$(printf "%s" "$DATABASE_URL" | tr -d "\r\n")"
          export DATABASE_URL
          printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL

      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LEGAKEYS }}
        run: |
          set -euo pipefail
          npx wrangler deploy --strict | tee /tmp/legakeys-wrangler-deploy.log
          version="$(sed -n 's/^Current Version ID: //p' /tmp/legakeys-wrangler-deploy.log | tail -n 1)"
          test -n "$version" || { echo "Could not capture deployed Worker version ID"; exit 1; }
          echo "LEGAKEYS_VERSION_ID=$version" >> "$GITHUB_ENV"
          echo "Deployed Worker version: $version"
      - name: Verify deployed canonical runtime
        env:
          LEGAKEYS_PRODUCTION_URL: https://legakeys1.kyabutwabis-f.workers.dev
          LEGAKEYS_VERSION_ID: ${{ env.LEGAKEYS_VERSION_ID }}
        run: |
          node --input-type=module - <<'NODE'
          const base = process.env.LEGAKEYS_PRODUCTION_URL.replace(/\/$/, "");
          const version = process.env.LEGAKEYS_VERSION_ID;
          const headers = { accept: "application/json", "Cloudflare-Workers-Version-Overrides": `legakeys1="${version}"` };
          const checks = ["/api/health", "/api/services", "/api/core-domains"];
          const protectedChecks = ["/api/places", "/api/activity", "/api/workspaces", "/api/identity"];
          for (const path of checks) {
            const response = await fetch(base + path, { headers });
            const body = await response.json().catch(() => null);
            console.log(path, response.status, JSON.stringify(body));
            if (!response.ok || body?.ok !== true) process.exit(1);
            if (path === "/api/services" && (!Array.isArray(body.data) || body.data.length < 17)) process.exit(1);
            if (path === "/api/health" && body?.missing_tables?.length) process.exit(1);
            if (path === "/api/core-domains" && body?.matrix?.beataccess?.state !== "VERIFIED") process.exit(1);
          }
          for (const path of protectedChecks) {
            const response = await fetch(base + path, { headers: { accept: "application/json" } });
            const body = await response.json().catch(() => null);
            console.log(path, response.status, JSON.stringify(body));
            if (response.status !== 401 || body?.code !== "CANONICAL_SESSION_REQUIRED") process.exit(1);
          }
          const access = await fetch(base + "/api/beataccess/overview", { headers });
          const accessBody = await access.json().catch(() => null);
          console.log("/api/beataccess/overview", access.status, JSON.stringify(accessBody));
          if (access.status !== 401 || accessBody?.code !== "CANONICAL_SESSION_REQUIRED") process.exit(1);
          NODE
